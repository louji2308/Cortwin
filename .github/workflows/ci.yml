# CorTwin CI - the full blocking verification chain, in AGENTS.md section 12 order.
#
# Chain (each step name carries the gate it proves):
#   ruff -> pytest (VC-01..VC-06) -> tsc -> vitest (VC-06..VC-11) ->
#   build + inline verify (C-01 / C-15) -> playwright e2e (VC-12 / VC-13 / VC-15)
#
# Rules honoured here (AGENTS.md section 7 + Tech_Stack):
#   - no secrets, no tokens, no external services: contents:read is the only permission
#   - no backend: this workflow only proves a static build
#   - every step has an explicit timeout; no step may hang a runner indefinitely
#   - the deployed artifact is produced by `npm run build` exactly as locally
#   - a missing dataset fails LOUDLY (never a silently skipped blocking test)

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: "Verify - VC-01..VC-15 full chain"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: "Setup Python 3.12 (Tech_Stack pin)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
        timeout-minutes: 5

      - name: "Install pinned Python requirements (requirements.lock.txt)"
        run: python -m pip install -r requirements.lock.txt
        timeout-minutes: 15

      - name: "Lint - ruff check . (AG section 12, step 1)"
        run: python -m ruff check .
        timeout-minutes: 5

      - name: "Dataset gate - data/raw prerequisite for blocking pytest"
        # data/raw/ ships in-repo (CC BY 4.0 — data/PROVENANCE.md); .gitignore
        # allowlists the three checksummed files. `make data` runs
        # pipeline/fetch_data.py (owner B0-2): verifies committed files against
        # data/CHECKSUMS.txt, or downloads + converts if they are absent.
        # A missing/corrupt dataset must fail the build loudly:
        # pipeline.dataset verify_checksums raises for every load_dataset() caller.
        run: |
          if [ -f pipeline/fetch_data.py ]; then
            make data
          else
            echo "::error title=Fetch missing::pipeline/fetch_data.py is absent; 'make data' cannot verify data/raw."
            exit 1
          fi
          if [ ! -f data/raw/extention-of-z-alizadeh-sani.csv ]; then
            echo "::error title=Dataset missing::data/raw/extention-of-z-alizadeh-sani.csv is absent. Blocking pytest cannot run without it."
            exit 1
          fi
        timeout-minutes: 15

      # Decision D-19 (2026-10-06): CI does NOT retrain. Cross-machine retrain
      # is not bit-reproducible (xgboost parallel FP accumulation depends on
      # runner hardware/thread count — run 37496900719: Linux retrain differed
      # from the committed Windows-trained artifacts at oracle margin 0.25, so
      # every joblib-consumption test failed). The trained artifacts are
      # therefore COMMITTED (pipeline/artifacts/deployed_model.joblib,
      # results.json) and CI validates the committed chain:
      #   test_manifest (Level-0 hash chain) + test_export_model (fresh export
      #   == committed model.json) + test_oracle/test_shap_exact (numeric
      #   parity of the committed joblib) + npm run verify:dist (built bundle).
      # The producer itself is still exercised every run: pytest's
      # test_reproduce_smoke_writes_valid_results re-executes
      # `python -m pipeline.reproduce` into a sandboxed output root, proving
      # the pipeline trains + writes valid results without touching
      # committed bytes. G2's byte-identical claim is same-machine evidence
      # only — law 16: never claim measured when it was not.

      - name: "VC-01..VC-06 - pytest -q (schema, leakage, encoding, protocol, compile, oracle parity)"
        run: python -m pytest -q
        timeout-minutes: 30

      - name: "Artifact immutability guard - tests never mutate committed files (D-19)"
        # test_results_schema's reproduce smoke used to overwrite root
        # results.json + joblib in place; a wrong-hash results.json was once
        # committed from exactly that bug (e84cf1e). This guard makes the whole
        # class unshippable: any test that dirties a tracked file fails CI here.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Committed artifact mutated::A test wrote to a tracked file:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
        timeout-minutes: 2

      - name: "Setup Node 22 (Tech_Stack pin)"
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
        timeout-minutes: 5

      - name: "Clean npm install from the lockfile (npm ci)"
        working-directory: web
        run: npm ci
        timeout-minutes: 15

      - name: "Compile gate - tsc -p tsconfig.json --noEmit"
        working-directory: web
        run: npx tsc -p tsconfig.json --noEmit
        timeout-minutes: 10

      - name: "VC-06..VC-11 - vitest run (TypeScript parity, domain, store, registry, view-model, copy)"
        working-directory: web
        run: npx vitest run
        timeout-minutes: 20

      - name: "Production build - npm run build (tsc + vite build, base ./)"
        working-directory: web
        run: npm run build
        timeout-minutes: 10

      - name: "Artifact integrity - C-01 manifest inline + C-15 CSP byte-exact"
        working-directory: web
        run: npm run verify:dist
        timeout-minutes: 5

      - name: "Install Playwright chromium (version pinned by web/package-lock.json)"
        working-directory: web
        run: npx playwright install --with-deps chromium
        timeout-minutes: 15

      - name: "VC-12 / VC-13 / VC-15 - e2e (golden path, offline, request + storage audit, CSP, deploy smoke)"
        working-directory: web
        run: npm run test:e2e
        timeout-minutes: 30

      - name: "Makefile target parity (decision D-03, dry run)"
        run: make -n test
        timeout-minutes: 5

      - name: "Upload Playwright evidence on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: tools/qa/artifacts/
          if-no-files-found: ignore
          retention-days: 7
        timeout-minutes: 5
